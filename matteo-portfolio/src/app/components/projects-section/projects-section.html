<section class="section projects" id="projects" aria-labelledby="projects-title">
  <app-section-heading
    [eyebrow]="ui.eyebrow"
    [title]="ui.title"
    [description]="ui.description"
    headingId="projects-title"
  />

  <div class="projects__grid">
    @for (project of projects; track project.name) {
      <article class="project-card reveal">
        <div class="project-card__topline">
          <span>{{ project.status }}</span>
        </div>
        <h3>{{ project.name }}</h3>
        <p>{{ project.description }}</p>
        <div class="project-card__stack" [attr.aria-label]="ui.stackLabel">
          @for (tech of project.stack; track tech) {
            <span>{{ tech }}</span>
          }
        </div>
        @if (project.siteUrl) {
          <div class="project-card__links">
            <a [href]="project.siteUrl" target="_blank" rel="noreferrer">{{ project.siteLabel }}</a>
          </div>
        }
      </article>
    }
  </div>
</section>
